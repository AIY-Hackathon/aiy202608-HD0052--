<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 头部区域 -->
  <header>
    <h1>👋 你好，欢迎来到我的网页</h1>
    <p class="subtitle">一个最简网页示例，用来演示 HTML / CSS / JS 的基本架构</p>
  </header>

  <!-- 主体内容 -->
  <main>
    <section class="card">
      <h2>📄 HTML</h2>
      <p>HTML 是网页的<strong>骨架</strong>，负责定义内容和结构。</p>
      <ul>
        <li><code>&lt;header&gt;</code> — 头部</li>
        <li><code>&lt;main&gt;</code> — 主体</li>
        <li><code>&lt;footer&gt;</code> — 底部</li>
      </ul>
    </section>

    <section class="card">
      <h2>🎨 CSS</h2>
      <p>CSS 是网页的<strong>皮肤</strong>，负责颜色、布局、字体等样式。</p>
      <button id="themeBtn" class="btn">切换深色模式</button>
    </section>

    <section class="card">
      <h2>⚡ JavaScript</h2>
      <p>JavaScript 是网页的<strong>肌肉</strong>，负责交互和动态行为。</p>
      <button id="greetBtn" class="btn">点我打个招呼</button>
      <p id="greetMsg" class="greet-msg"></p>
    </section>
  </main>

  <!-- 底部 -->
  <footer>
    <p>用 ❤️ 和 HTML/CSS/JS 搭建 · 通过 Git 管理版本</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
